<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <section class="counter-card" aria-labelledby="counter-title">
      <h1 id="counter-title">Counter</h1>
      <p class="counter-value" id="value" aria-live="polite" aria-atomic="true">0</p>
      <div class="counter-controls">
        <button class="counter-button" id="decrease" type="button">Decrease</button>
        <button class="counter-button" id="reset" type="button">Reset</button>
        <button class="counter-button" id="increase" type="button">Increase</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>

</html>
